ktor {
    deployment {
        port = 8765
        host = "127.0.0.1"
    }
    application {
        modules = [ com.omnipos.agent.ApplicationKt.module ]
    }
}

agent {
    host = "127.0.0.1"
    port = 8765
    version = "0.1.0"
    printer {
        name = ""
    }
    drawer {
        enabled = true
    }
    paper_width_mm = 80
    encoding = "UTF-8"
    terminal_id = "OMNIPOS-TERMINAL"
    security {
        token = ""
        allowed_origins = [
            "http://127.0.0.1:8001",
            "http://localhost:8001",
            "http://127.0.0.1:8000",
            "http://localhost:8000",
            "http://127.0.0.1:5173",
            "http://localhost:5173"
        ]
        rate_limit_per_minute = 120
    }
}
