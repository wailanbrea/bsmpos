<!DOCTYPE html>

<style>
        /* Custom scrollbar for grid */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #dcd8e5; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c7c4d8; }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease-in-out;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: rgba(79, 70, 229, 0.3); /* Primary tint on hover */
        }

        .glass-card.selected {
            border-color: #4f46e5;
            background: #f5f2ff; /* surface-container-low */
            box-shadow: 0 0 0 2px #4f46e5;
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-sans">
<!-- Progress & Header Area -->
<header class="w-full max-w-5xl mx-auto px-margin-mobile md:px-margin-desktop pt-12 pb-8 text-center flex flex-col items-center">
<!-- Progress Indicator -->
<div class="flex items-center gap-2 mb-8">
<div class="h-2 w-12 rounded-full bg-primary"></div>
<div class="h-2 w-12 rounded-full bg-primary"></div>
<div class="h-2 w-12 rounded-full bg-surface-container-highest"></div>
<div class="h-2 w-12 rounded-full bg-surface-container-highest"></div>
<div class="h-2 w-12 rounded-full bg-surface-container-highest"></div>
</div>
<p class="font-label-md text-label-md text-outline uppercase tracking-wider mb-2">Paso 2 de 5</p>
<h1 class="font-display-lg text-display-lg md:font-headline-lg md:text-headline-lg text-on-background mb-4">¿Cuál es tu tipo de negocio?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Selecciona la industria que mejor describa tu operación. Esto nos ayudará a configurar OmniPOS con las herramientas adecuadas para ti (contexto RD$).</p>
</header>
<!-- Main Content Area: Bento Grid of Industries -->
<main class="flex-grow w-full max-w-5xl mx-auto px-margin-mobile md:px-margin-desktop pb-24">
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-container-gap">
<!-- Card 1: Restaurante -->
<button class="glass-card rounded-xl p-6 flex flex-col items-start text-left focus:outline-none selected relative overflow-hidden group">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="bg-primary-container text-on-primary-container p-3 rounded-lg mb-4 inline-flex">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<h3 class="font-title-lg text-title-lg mb-2">Restaurante</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Gestión de mesas, comandas a cocina y control de ingredientes complejos.</p>
<div class="absolute bottom-4 right-4 text-primary opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Card 2: Cafetería -->
<button class="glass-card rounded-xl p-6 flex flex-col items-start text-left focus:outline-none relative overflow-hidden group">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">local_cafe</span>
</div>
<div class="bg-surface-container-high text-on-surface-variant p-3 rounded-lg mb-4 inline-flex group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">local_cafe</span>
</div>
<h3 class="font-title-lg text-title-lg mb-2">Cafetería</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Pedidos rápidos, modificaciones de bebidas y control de caja ágil.</p>
</button>
<!-- Card 3: Supermercado -->
<button class="glass-card rounded-xl p-6 flex flex-col items-start text-left focus:outline-none relative overflow-hidden group">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<div class="bg-surface-container-high text-on-surface-variant p-3 rounded-lg mb-4 inline-flex group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">storefront</span>
</div>
<h3 class="font-title-lg text-title-lg mb-2">Supermercado</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Escaneo rápido de códigos de barras, gestión de alto volumen y balanzas.</p>
</button>
<!-- Card 4: Tienda (Retail) -->
<button class="glass-card rounded-xl p-6 flex flex-col items-start text-left focus:outline-none relative overflow-hidden group">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
</div>
<div class="bg-surface-container-high text-on-surface-variant p-3 rounded-lg mb-4 inline-flex group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<h3 class="font-title-lg text-title-lg mb-2">Tienda de Retail</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Control de inventario por variantes (talla/color) y devoluciones simples.</p>
</button>
<!-- Card 5: Barbería / Salón -->
<button class="glass-card rounded-xl p-6 flex flex-col items-start text-left focus:outline-none relative overflow-hidden group">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">content_cut</span>
</div>
<div class="bg-surface-container-high text-on-surface-variant p-3 rounded-lg mb-4 inline-flex group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">content_cut</span>
</div>
<h3 class="font-title-lg text-title-lg mb-2">Barbería / Salón</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Gestión de citas, comisiones por estilista y venta de productos.</p>
</button>
<!-- Card 6: Taller Mecánico -->
<button class="glass-card rounded-xl p-6 flex flex-col items-start text-left focus:outline-none relative overflow-hidden group">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">build</span>
</div>
<div class="bg-surface-container-high text-on-surface-variant p-3 rounded-lg mb-4 inline-flex group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">build</span>
</div>
<h3 class="font-title-lg text-title-lg mb-2">Taller Mecánico</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Cotizaciones detalladas, seguimiento de órdenes de trabajo y repuestos.</p>
</button>
<!-- Card 7: Servicios Profesionales (Spans 2 cols on MD, 3 on LG if needed, but let's just make it normal for bento) -->
<button class="glass-card rounded-xl p-6 flex flex-col items-start text-left focus:outline-none relative overflow-hidden group md:col-span-2 lg:col-span-1">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-6xl text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">business_center</span>
</div>
<div class="bg-surface-container-high text-on-surface-variant p-3 rounded-lg mb-4 inline-flex group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">business_center</span>
</div>
<h3 class="font-title-lg text-title-lg mb-2">Servicios Profesionales</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Facturación recurrente, gestión de clientes y servicios por hora.</p>
</button>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant p-margin-mobile md:p-margin-desktop z-50 flex justify-between items-center pb-safe">
<button class="px-6 h-touch-target-min rounded-lg border border-outline font-label-lg text-label-lg text-on-surface hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-lg">arrow_back</span>
            Atrás
        </button>
<button class="px-8 h-touch-target-relaxed rounded-lg bg-primary text-on-primary font-label-lg text-label-lg hover:bg-surface-tint shadow-lg hover:shadow-none hover:scale-[0.98] transition-all flex items-center gap-2">
            Siguiente
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<script>
        // Simple script to handle card selection visual toggle for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.glass-card');

            cards.forEach(card => {
                card.addEventListener('click', function() {
                    // Remove selected state from all
                    cards.forEach(c => {
                        c.classList.remove('selected');
                        const check = c.querySelector('.material-symbols-outlined:last-child');
                        if(check && check.textContent === 'check_circle') {
                             check.parentElement.remove();
                        }
                    });

                    // Add selected state to clicked
                    this.classList.add('selected');

                    // Add checkmark if it doesn't exist
                    if (!this.querySelector('.material-symbols-outlined:last-child') || this.querySelector('.material-symbols-outlined:last-child').textContent !== 'check_circle') {
                        const checkContainer = document.createElement('div');
                        checkContainer.className = 'absolute bottom-4 right-4 text-primary opacity-100 transition-opacity';
                        checkContainer.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
                        this.appendChild(checkContainer);
                    }
                });
            });
        });
    </script>
</body></html>
